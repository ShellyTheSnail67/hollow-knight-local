<!DOCTYPE html>
<html lang="en-us">

<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Unity WebGL Player | Hollow Knight</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            background: #231F20;
        }

        #unity-container {
            width: 100%;
            height: 100%;
            position: fixed;
            top: 0;
            left: 0;
        }
    </style>
</head>

<body>
    <div id="loading-text" style="color: white; font-size: 48px; font-family: cursive; text-align: center; margin-top: 20px;">LOADING...</div>
    <div hidden id="unity-container" class="unity-desktop">
        <canvas id="unity-canvas"></canvas>
        <div id="unity-loading-bar">
            <div id="unity-logo"></div>
            <div id="unity-progress-bar-empty">
                <div id="unity-progress-bar-full"></div>
            </div>
        </div>
        <div id="unity-mobile-warning">WebGL builds are not supported on mobile devices.</div>
    </div>
    <script>
        const loadingText = document.querySelector('#loading-text');
        const buildRoot = './Build';
        let totalBytes = 0;
        let loadedBytes = 0;

        async function getSize(url) {
            try {
                const res = await fetch(url, { method: 'HEAD' });
                return parseInt(res.headers.get('Content-Length') || '0', 10);
            } catch {
                return 0;
            }
        }

        function getParts(file, start, end) {
            const parts = [];
            for (let i = start; i <= end; i++) {
                parts.push(`${file}.part${i}`);
            }
            return parts;
        }

        async function downloadSequentially(urls, onProgress) {
            const chunks = [];
            let received = 0;

            for (const url of urls) {
                const response = await fetch(url);
                if (!response.ok) {
                    throw new Error(`Failed to fetch ${url}: ${response.status} ${response.statusText}`);
                }

                const blob = await response.blob();
                chunks.push(blob);
                received += blob.size;
                loadedBytes += blob.size;
                if (onProgress) {
                    onProgress(received, totalBytes, url);
                }
            }

            return new Blob(chunks);
        }

        async function downloadUnityBuild() {
            const dataParts = getParts(`${buildRoot}/hk.data`, 1, 42);
            const wasmParts = getParts(`${buildRoot}/hk.wasm`, 1, 2);
            const allParts = [...dataParts, ...wasmParts];

            const sizes = await Promise.all(allParts.map(getSize));
            totalBytes = sizes.reduce((sum, size) => sum + size, 0);

            const dataUrlObj = await downloadSequentially(dataParts, (received, total, currentUrl) => {
                const mbDone = (received / (1024 * 1024)).toFixed(2);
                const mbTotal = (total / (1024 * 1024)).toFixed(2);
                loadingText.textContent = `LOADING... ${mbDone} MB / ${mbTotal} MB (${currentUrl.split('/').pop()})`;
            });

            const wasmUrlObj = await downloadSequentially(wasmParts, () => {
                // keep the data progress UI stable while the wasm is merged in the background
                const mbDone = (loadedBytes / (1024 * 1024)).toFixed(2);
                const mbTotal = (totalBytes / (1024 * 1024)).toFixed(2);
                loadingText.textContent = `LOADING... ${mbDone} MB / ${mbTotal} MB`;
            });

            return {
                dataUrl: URL.createObjectURL(dataUrlObj),
                codeUrl: URL.createObjectURL(wasmUrlObj),
            };
        }

        (async () => {
            try {
                const { dataUrl, codeUrl } = await downloadUnityBuild();

                const loaderUrl = `${buildRoot}/hk.loader.js`;
                const config = {
                    dataUrl,
                    frameworkUrl: `${buildRoot}/hk.framework.js`,
                    codeUrl,
                    streamingAssetsUrl: 'StreamingAssets',
                    companyName: 'Team Cherry & Truffled',
                    productName: 'Hollow Knight',
                    productVersion: '1.0',
                };

                const container = document.querySelector('#unity-container');
                container.hidden = false;

                const canvas = document.querySelector('#unity-canvas');
                const loadingBar = document.querySelector('#unity-loading-bar');
                const progressBarFull = document.querySelector('#unity-progress-bar-full');
                const mobileWarning = document.querySelector('#unity-mobile-warning');

                if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
                    container.className = 'unity-mobile';
                    config.devicePixelRatio = 1;
                    mobileWarning.style.display = 'block';
                    setTimeout(() => {
                        mobileWarning.style.display = 'none';
                    }, 5000);
                } else {
                    function resizeCanvas() {
                        canvas.width = window.innerWidth;
                        canvas.height = window.innerHeight;
                        canvas.style.width = window.innerWidth + 'px';
                        canvas.style.height = window.innerHeight + 'px';
                    }
                    resizeCanvas();
                    window.addEventListener('resize', resizeCanvas);
                }

                loadingBar.style.display = 'block';
                const script = document.createElement('script');
                script.src = loaderUrl;
                script.onload = () => {
                    createUnityInstance(canvas, config, (progress) => {
                        progressBarFull.style.width = `${100 * progress}%`;
                    }).then(() => {
                        loadingText.remove();
                        loadingBar.style.display = 'none';
                        canvas.style.display = 'block';
                    }).catch((message) => {
                        alert(message);
                    });
                };
                document.body.appendChild(script);
            } catch (error) {
                console.error(error);
                loadingText.textContent = 'ERROR: The game could not be loaded. Please serve the project via a local web server.';
                alert(error.message || 'The game failed to load.');
            }
        })();

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./service-worker.js').catch((error) => {
                    console.warn('Service worker failed to register:', error);
                });
            });
        }
    </script>
</body>

</html>
